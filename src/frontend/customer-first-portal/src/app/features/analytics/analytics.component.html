<div class="analytics-container">
  <div class="analytics-header">
    <h1>Analytics Dashboard</h1>
  </div>

  <p-message *ngIf="error" severity="error" [text]="error"></p-message>

  <div class="analytics-grid">
    <!-- Dashboard Summary KPI Cards -->
    <div class="section-full" *ngIf="dashboardSummary">
      <h2>Overview</h2>
      <div class="kpi-grid">
        <app-kpi-card
          label="Total Submissions"
          [value]="dashboardSummary.totalSubmissions"
          [highlight]="dashboardSummary.totalSubmissions > 0"
          navigateTo="/admin-review"
          [queryParams]="{ status: 'All' }"
          icon="📊"
        >
        </app-kpi-card>
        <app-kpi-card
          label="Pending Review"
          [value]="dashboardSummary.pendingReview"
          [highlight]="dashboardSummary.pendingReview > 0"
          navigateTo="/admin-review"
          [queryParams]="{ status: 'Submitted' }"
          icon="⏳"
        >
        </app-kpi-card>
        <app-kpi-card
          label="Approved"
          [value]="dashboardSummary.approved"
          [highlight]="dashboardSummary.approved > 0"
          navigateTo="/admin-review"
          [queryParams]="{ status: 'Approved' }"
          icon="✅"
        >
        </app-kpi-card>
        <app-kpi-card
          label="Rejected"
          [value]="dashboardSummary.rejected"
          [highlight]="dashboardSummary.rejected > 0"
          navigateTo="/admin-review"
          [queryParams]="{ status: 'Rejected' }"
          icon="❌"
        >
        </app-kpi-card>
        <app-kpi-card
          label="Approval Rate"
          [value]="dashboardSummary.approvalRate.toFixed(1) + '%'"
          icon="📈"
        >
        </app-kpi-card>
        <app-kpi-card
          label="Avg Review Time"
          [value]="dashboardSummary.averageReviewTimeHours.toFixed(1) + ' hrs'"
          icon="⏱️"
        >
        </app-kpi-card>
      </div>
    </div>

    <!-- Status Breakdown -->
    <div class="section-half" *ngIf="submissionsByStatus">
      <app-status-breakdown [data]="submissionsByStatus"></app-status-breakdown>
    </div>

    <!-- Approval Metrics -->
    <div class="section-half" *ngIf="approvalMetrics">
      <app-approval-metrics [data]="approvalMetrics"></app-approval-metrics>
    </div>

    <!-- Submission Type Analysis -->
    <div class="section-full" *ngIf="submissionTypeAnalysis">
      <app-submission-type-chart
        [data]="submissionTypeAnalysis"
      ></app-submission-type-chart>
    </div>

    <!-- Top Nominees -->
    <div class="section-full" *ngIf="recognitionByNominee">
      <app-top-nominees [data]="recognitionByNominee"></app-top-nominees>
    </div>

    <!-- Nomination Reports -->
    <div class="section-full">
      <h2>Nomination Reports</h2>
      <app-nomination-report></app-nomination-report>
    </div>
  </div>
</div>
